[project]
name = "stock-signals"
version = "0.1.0"
description = "Portfolio advisor for NSE equities and Indian mutual funds"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "pyyaml>=6.0",
    # NSE price history. Unofficial but actively maintained, and the only free
    # source that needs no API key -- which is what lets the nightly job run
    # unattended. Pinned to a minor floor because its NSE scraping breaks when
    # NSE changes its site.
    "jugaad-data>=0.35",
    # Reads the Console .xlsx holdings statement (import_holdings.py).
    "openpyxl>=3.1",
    # Yahoo fallback in fetch_fundamentals.py: ROE, ROCE, debt/equity, P/E, CFO.
    "yfinance>=1.7",
    # Reads PPFAS's older .xls portfolio disclosures (run_mf_ppfas.py); the
    # newer .xlsx ones go through openpyxl.
    "xlrd>=2.0",
    # The dashboard (run_ui.py).
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "backtest", "book", "data", "indicators", "mf", "ops",
            "picker", "records", "results", "scoring", "signals", "strategy", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
