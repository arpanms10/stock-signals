[project]
name = "stock-signals"
version = "0.1.0"
description = "Personal technical signal engine for NSE equities"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "pyyaml>=6.0",
    # NSE price history. Unofficial but actively maintained, and the only free
    # source that needs no API key -- which is what lets the nightly job run
    # unattended. Pinned to a minor floor because its NSE scraping breaks when
    # NSE changes its site.
    "jugaad-data>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indicators", "scoring", "signals", "backtest", "delivery", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
