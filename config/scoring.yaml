# Every number the engine uses to make a decision lives here.
# Ranges are [low, high]: a value at or below `low` scores 0, at or above
# `high` scores 100, and interpolates linearly in between.

weights:            # must sum to 1.0
  trend: 0.30
  momentum: 0.25
  relative_strength: 0.20
  volume: 0.15
  volatility: 0.10

trend:
  weights: {px_vs_200: 0.30, px_vs_50: 0.20, slope_200: 0.25, golden_cross: 0.15, adx: 0.10}
  px_vs_200_pct: [-10.0, 20.0]     # close vs 200 DMA, percent
  px_vs_50_pct: [-8.0, 12.0]
  slope_200_pct: [-3.0, 5.0]       # 200 DMA change over 21 bars, percent
  adx: [15.0, 40.0]                # below 15 is chop, above 40 is a strong trend

momentum:
  weights: {rsi: 0.40, macd: 0.35, roc: 0.25}
  rsi: [30.0, 70.0]
  macd_hist_atr: [-0.5, 0.5]       # MACD histogram in ATR units (scale-free)
  roc60_pct: [-15.0, 25.0]

relative_strength:
  weights: {excess_1m: 0.25, excess_3m: 0.40, excess_6m: 0.35}
  excess_1m_pct: [-8.0, 8.0]       # return minus benchmark return
  excess_3m_pct: [-12.0, 15.0]
  excess_6m_pct: [-18.0, 22.0]

volume:
  weights: {ud_ratio: 0.45, obv_slope: 0.35, vol_ratio: 0.20}
  ud_ratio: [0.7, 1.5]             # up-day volume / down-day volume, 20 bars
  obv_slope_pct: [-25.0, 25.0]     # net directional volume, % of volume traded
  vol_ratio: [0.5, 1.8]            # today's volume / 20-day average

volatility:
  # Calmer scores higher: a 2% ATR trend is far easier to hold, and to place a
  # stop on, than an 8% one. Inverted range -- high ATR maps to a low score.
  weights: {atr: 0.70, bb_width: 0.30}
  atr_pct: [7.0, 1.5]
  bb_width_pct: [30.0, 6.0]

signals:
  buy_score: 60.0                  # trend-entry threshold
  exit_score: 30.0                 # score-collapse exit
  trim_rsi_high: 75.0
  trim_rsi_reset: 70.0
  pullback_rsi: [40.0, 50.0]
  breakout_lookback: 250           # bars for the 52-week high test
  breakout_volume_mult: 1.5
  trend_break_sma: 50              # 50 = cut on noise, 200 = cut on regime change
  use_death_cross: true
  regime_index: "NIFTY 500"
  regime_sma: 200
  cooldown_days: 5

risk:
  stop_atr_mult: 2.0               # hard stop distance below entry
  stop_max_loss_pct: 15.0          # floor -- whichever is tighter wins
  trail_activate_pct: 15.0         # profit needed before trailing begins
  trail_atr_mult: 2.5              # chandelier exit distance
  risk_per_trade_pct: 1.0          # max portfolio % lost if the stop hits
  max_position_pct: 5.0
  max_sector_pct: 25.0
  min_trade_pct: 0.5               # an add smaller than this % of the book is
                                   # not worth the brokerage and attention; the
                                   # backtests skip trades below the same 0.5%
  max_positions: 10
  trail_lookback_days: 365         # fallback when a purchase date is unknown

targets:
  # Targets are expressed in R -- multiples of the risk you are taking on the
  # trade, where 1R = entry price minus stop price. Tying targets to risk
  # rather than to a round percentage means a calm stock and a volatile one
  # both get targets that are meaningful for *that* stock.
  enabled: true
  t1_r: 1.5                        # book part of the position here
  t2_r: 3.0                        # book the remainder here
  t1_book_pct: 50.0                # percent of the position sold at T1
  breakeven_after_t1: true         # move the stop to entry once T1 is hit

  # How long a target normally takes, measured from 9,650 sampled paths across
  # 193 liquid NSE stocks, 2018-2026. These are OBSERVED percentiles, not a
  # forecast -- a volatility-based formula was tested and had essentially no
  # predictive power (correlation -0.03 with actual time to target).
  #
  # Reported so you can tell normal from unusual. NOT an exit rule: positions
  # slow to reach T1 went on to return 7.4% over the following six months
  # against 9.6% for fast ones, with identical hit rates. A 2.2-point median
  # gap does not survive transaction costs.
  horizon_sessions:
    t1: {median: 17, typical: 45, slow: 103, never_pct: 12}
    t2: {median: 37, typical: 81, slow: 157, never_pct: 21}

# ---------------------------------------------------------------------------
# Cross-sectional momentum (Tier 1a). A different strategy class from the
# signal rules above: it always holds a slice of the universe and rotates by
# rank, rather than deciding whether to be in the market at all.
# ---------------------------------------------------------------------------
momentum_strategy:                 # NOTE: distinct from the `momentum:`
                                   # scoring bucket above -- same word, very
                                   # different thing. Do not merge them.
  lookback_months: 9               # main ranking: 9-1 momentum. On the
                                   # continuous price history (2026-10-11)
                                   # 23.0% vs 12-month's 20.2%, ahead on all
                                   # four start dates (docs/validation.md).
                                   # 12 stays alongside: chosen on this data.
  compare_lookback_months: 12      # also rank on 12-1 and show both side by
                                   # side, with the names top-n on BOTH.
  skip_months: 1                   # exclude the latest month -- short-horizon
                                   # returns reverse, so including it hurts.
                                   # Tested 2026-10 (docs/validation.md): beat
                                   # skip 0 in 5 of 6 runs. Hurts at 6 months.
  risk_adjusted: true              # divide momentum by realised volatility
  vol_window: 252
  require_above_200dma: true       # no falling knives in the top slice
  n_hold: 15
  enter_rank: 15                   # buy on reaching the top 15 ...
  exit_rank: 30                    # ... and only sell after falling past 30
                                   # (the gap stops boundary names churning)
  rebalance_days: 21               # monthly
  stop: none                       # trailing stop between rebalances:
                                   # none | pct | atr (backtest only)
  stop_pct: 15.0                   # pct: below the highest close since entry
  stop_atr_mult: 3.0               # atr: ATR multiples below that high
  stop_atr_window: 14              # ATR from close-to-close moves
  stop_refill: cash                # cash = wait for the rebalance; next =
                                   # buy the next-ranked name from it
  risk_off_scale: 1.0              # names held when the index is below its
                                   # 200 DMA, as a fraction of n_hold. Was 0.5;
                                   # tested 2026-10-04 (docs/validation.md): it
                                   # did not reduce drawdowns, and only paid off
                                   # with the 9-month lookback chosen on the
                                   # same data. The live advisor never applied
                                   # it, so 1.0 also makes backtest = advice.
  # Volatility targeting: scale gross exposure so the PORTFOLIO runs at a
  # target volatility rather than whatever the holdings happen to give.
  # The best-evidenced improvement to momentum's Sharpe, and a structural
  # change rather than a threshold tweak -- it attacks the -44% drawdown,
  # which is the real problem, not the return.
  vol_target: false                # off by default until it clears a holdout
  vol_target_pct: 15.0             # annualised portfolio volatility to aim at
  vol_lookback: 60                 # sessions used to estimate realised vol
  vol_max_leverage: 1.0            # never above fully invested -- no borrowing
  vol_min_exposure: 0.3            # floor, so a vol spike does not go to cash
  cash_yield_pct: 0.0              # backtest: yield on idle cash. 0 is
                                   # harsh on vol targeting; ~6.5 is a
                                   # liquid fund
  min_price: 20.0                  # rupees. Momentum divided by volatility
                                   # ranks a pumped penny stock first; a price
                                   # floor is the cheapest guard against it
  min_turnover_cr: 5.0             # average daily traded value, crores
  # A stock trading far above its own 200 DMA has already made the move the
  # ranking is trying to catch. CUPID ranked first on +662% 12-1 momentum while
  # sitting 109% above its 200 DMA -- liquid and not cheap, so the price and
  # turnover floors above did nothing about it.
  #
  # TESTED AND LEFT OFF. On 2018-2022 the results were non-monotonic: a 40%
  # cap gave Sharpe 0.64, 60% gave 0.36, 80% gave 0.59, 120% gave 0.48. A real
  # effect trends as the cap tightens; this jumps around, which is noise.
  # Choosing 40% because it scored best is the curve-fitting the harness
  # exists to prevent. 0 disables the check.
  max_extension_pct: 0.0
  quality_floor: 50.0              # fundamentals gate for the combined rank
  allow_unknown_quality: true      # unscored stocks stay eligible, but every
                                   # run names them -- so "unknown" never
                                   # quietly passes as "acceptable"

# ---------------------------------------------------------------------------
# Indian equity capital gains, for trim/exit timing. Rates change with the
# Budget -- these are editable precisely so they can be corrected without
# touching code. Estimates only; this is not tax advice.
# ---------------------------------------------------------------------------
tax:
  ltcg_threshold_days: 365         # held longer than this = long term
  stcg_rate_pct: 20.0              # short-term capital gains on listed equity
  ltcg_rate_pct: 12.5              # long-term, above the exemption
  ltcg_exemption: 125000           # annual LTCG exemption, rupees
  near_ltcg_days: 45               # "nearly long term" -- worth waiting out

trimming:
  # A trim is a drift correction, not an emergency. These control how patient
  # the framework is allowed to be about executing one.
  tolerance_multiple: 1.2          # only trim once past 1.2x the cap
  tranches: 3                      # split a large trim rather than dumping it
  tranche_min_value: 15000         # below this, one tranche -- costs dominate
  prefer_strength: true            # trim into rallies, not into weakness

# ---------------------------------------------------------------------------
# F&O analysis (strategy/fno.py, run_fno.py). Option open interest says where
# writers have put money, not where price will go: docs/f_o/validation.md found
# no edge for the walls, PCR or max pain. The range is spot +/- the ATM
# straddle, labelled with how often it has held.
# ---------------------------------------------------------------------------
fno:
  wall_window_pct: 10.0            # support/resistance searched within +/- this % of spot
  wall_min_share_pct: 5.0          # a wall must hold >= this % of its side's OI in the window
  # PCR (put OI / call OI), read the way Indian markets read it: puts are
  # mostly written, so a high PCR means writers are defending the downside.
  pcr_bearish_below: 0.7
  pcr_bullish_above: 1.2
  pcr_stretched_above: 1.6         # very high PCR is crowded -- contrarian caution
  # Stock PCR runs far lower than index PCR (median 0.63 vs 0.87, Jan 2024 -
  # Sep 2026), so stocks get their own thresholds: the 20th/80th/97th
  # percentiles of stock PCR. Labels describe positioning, not direction.
  equity_pcr_bearish_below: 0.5
  equity_pcr_bullish_above: 0.8
  equity_pcr_stretched_above: 1.05
  # Measured by run_fno_backtest.py on 2026-10-08: % of expiry closes inside
  # spot +/- ATM straddle, by sessions before expiry. Re-run and update.
  range_hit_pct:
    index:  {5: 49, 10: 56, 20: 58}
    equity: {5: 61, 10: 63, 20: 54}
  near_expiry_sessions: 2          # OI is distorted by rollover this close to expiry
  risk_free_pct: 6.5               # Greeks and IV from prices; small effect at <3 months
  stale_minutes: 30                # chain older than this during market hours is flagged

# ---------------------------------------------------------------------------
# Swing trading (strategy/swing.py, run_swing.py, the Swing tab). Holds for
# days to a few weeks, unlike the monthly momentum rotation above. Every
# suggestion needs an uptrend, a liquid stock and an active setup; the score
# only orders names that already qualify. Delivery (CNC) trades: overnight gap
# risk is real, and the backtest fills gaps at the open, not at the stop.
# ---------------------------------------------------------------------------
swing:
  universe: nifty200               # nifty200 | nifty500
  top_n: 10                        # suggestions shown before "show all"
  record_universes: [nifty200, nifty500]   # scans the daily job records
                                   # (run_swing_daily.py); the 500 is a few
                                   # times the rows, ~10 MB of CSV a year
  # Tradability
  min_price: 50.0                  # rupees
  min_turnover_cr: 20.0            # 20-day average traded value, crores
  atr_pct: [1.0, 6.0]              # daily ATR as % of price: below is too
                                   # sleepy to swing, above is a stop you
                                   # cannot size sensibly
  results_within_days: 5           # skip names reporting quarterly results
                                   # this soon (live only; the backtest has no
                                   # history of announcement dates)
  # Market regime: NIFTY 500 vs its 200 DMA, plus breadth (% of the universe
  # above its own 50 DMA). Shown with every suggestion; see `regime_gate`.
  breadth_min_pct: 50.0
  regime_gate: false               # true = no suggestions unless both pass
  # Setups
  pullback:
    ma: 20                         # EMA the pullback should reach
    touch_atr: 0.5                 # low within this many ATRs of the EMA ...
    touch_bars: 3                  # ... in the last N sessions
    rsi: [38.0, 58.0]              # RSI(14) reset, not broken
  breakout:
    lookback: 20                   # close above the prior N-session high
    volume_mult: 1.5               # on at least this x the 20-day volume
    max_base_pct: 15.0             # prior N-session range, % of price
    near_high_pct: 10.0            # within this % of the 52-week high
  # Score: weighted 0-100 components. Ranges map like the timing score above.
  weights: {trend: 0.25, relative_strength: 0.25, setup: 0.30,
            volume: 0.10, risk: 0.10}
  trend_ranges:
    sma50_vs_200_pct: [0.0, 15.0]
    slope_200_pct: [0.0, 4.0]
    adx: [15.0, 35.0]
  volume_ud_ratio: [0.8, 1.6]
  stop_pct_range: [10.0, 3.0]      # tighter stop scores higher (inverted)
  # Trade plan
  entry_buffer_pct: 0.1            # buy-stop this far above the signal high
  entry_valid_sessions: 2          # cancel if not triggered by then
  stop_lookback: 5                 # structure stop: lowest low of N sessions
  stop_buffer_atr: 0.25            # ... minus this many ATRs
  stop_atr: [1.0, 3.0]             # stop kept between these ATR multiples
  t1_r: 1.5                        # book t1_book_pct here, stop to entry
  t1_book_pct: 50.0
  t2_r: 3.0                        # remainder exits here ...
  max_hold_sessions: 15            # ... or at the close after this many
  risk_per_trade_pct: 0.75         # of capital, if the stop is hit
  max_position_pct: 15.0           # of capital, whatever the stop says
  round_trip_cost_pct: 0.35        # STT, stamp, fees, DP, slippage

# Quarterly results scorecard (results/, run_results.py). Judged against the
# company's OWN trend: free sources carry no analyst consensus, so "beat" here
# means better than its recent quarters, not better than the Street expected.
# Unvalidated until run_results_backtest.py says otherwise -- the verdict is
# shown, never used to rank.
results:
  quarters: 8                      # filings fetched per symbol (YoY + trend)
  strong_at: 2                     # points >= this = strong
  weak_at: -2                      # points <= this = weak
  # Ordinary companies. Each line is [bad, good]: at or past good scores +1,
  # at or past bad scores -1, between scores 0.
  revenue_yoy_pct: [0.0, 15.0]
  revenue_accel_pp: [-3.0, 3.0]    # YoY now minus mean YoY of the prior 3
  margin_yoy_bps: [-150.0, 100.0]  # EBITDA margin vs the same quarter last year
  core_pbt_yoy_pct: [0.0, 20.0]    # PBT less other income and exceptionals
  # Earnings-quality flags; any one costs a point.
  other_income_pct_of_pbt: 30.0
  exceptional_pct_of_pbt: 10.0
  # Banks and NBFCs.
  nii_yoy_pct: [5.0, 15.0]
  pat_yoy_pct: [0.0, 15.0]
  credit_cost_yoy_pp: [5.0, -5.0]  # provisions / pre-provision profit
  gnpa_qoq_bps: [20.0, -10.0]      # banks only; NBFCs do not file it in XBRL
  # Price reaction to the announcement, in multiples of daily ATR.
  reaction_atr: 1.0                # |move| >= this many ATRs is a reaction

# GARP / QARP stock picker (picker/, run_picker.py). All fundamentals from
# NSE filings, point in time; see docs/picker.md. Unvalidated until
# run_picker.py --backtest says otherwise.
picker:
  universe: nifty200
  top_n: 15
  min_sector_peers: 4              # fewer and P/E vs sector is left blank
  garp:
    min_growth: 15.0               # % a year: the LOWER of 1y and 2y core profit growth
    max_peg: 1.5                   # core P/E / growth; Lynch's line was 1.0
    growth_cap: 50.0               # growth above this is off a tiny base; capped
    min_interest_cover: 3.0
    max_de: 1.0                    # debt / equity, where the balance sheet is filed
    w_growth: 0.5                  # score = w x growth rank + (1-w) x PEG rank
  qarp:
    min_quality: 0.6               # percentile rank on quality, 0-1
    max_pe_hist_pct: 0.8           # skip when P/E is above 80% of its own last 3 years
    min_growth: 0.0                # still growing
    w_quality: 0.6                 # score = w x quality rank + (1-w) x price rank
  # Backtest: rebalance after each results season closes (45 days after the
  # quarter, 60 for March), hold until the next.
  rebalance: ["02-20", "06-05", "08-20", "11-20"]
  round_trip_cost_pct: 0.35
