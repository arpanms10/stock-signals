# Runs the test suite on every pull request and on pushes to main.
# The tests are hermetic: they need none of the local databases, caches or
# config/holdings.csv, and make no network calls (checked 2026-10-19 on a
# clean clone with the network blocked).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
